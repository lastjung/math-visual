<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Flow Lab | Dynamic Caustics Renderer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-group">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <div class="logo-text">
                <h1>LIGHT FLOW</h1>
                <p>Caustics Lab</p>
            </div>
        </div>

        <nav class="shape-tabs">
            <button class="shape-tab active" data-shape="circle">Circle</button>
            <button class="shape-tab" data-shape="ellipse">Ellipse</button>
            <button class="shape-tab" data-shape="parabola">Parabola</button>
            <button class="shape-tab" data-shape="cardioid">Cardioid</button>
        </nav>
        
        <div style="width: 140px;"></div> <!-- Spacer to balance header -->
    </header>

    <main class="main-stage">
        <!-- Canvas Section -->
        <section class="canvas-area" id="container">
            <canvas id="causticsCanvas"></canvas>
            <div class="drag-hint">Drag to direct the light flow</div>
        </section>

        <!-- Sidebar Section -->
        <aside class="controls-sidebar">
            <div class="control-panel">
                <div class="panel-header">
                    <span class="panel-title">Simulation</span>
                </div>

                <!-- Source Position Slider -->
                <div class="setting-row">
                    <div class="setting-label-group">
                        <label class="setting-label clickable-label" id="label-revolution">
                            <span id="animate-icon-mini" style="margin-right: 4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
                            Revolution
                        </label>
                        <span class="setting-value value-source" id="val-source">-90°</span>
                    </div>
                    <input type="range" id="range-source" min="-3.14159" max="3.14159" step="0.01" value="-1.571">
                </div>

                <!-- Source Rotation Slider -->
                <div class="setting-row">
                    <div class="setting-label-group">
                        <label class="setting-label clickable-label" id="label-rotation">
                            <span id="rotate-icon-mini" style="margin-right: 4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
                            Rotation
                        </label>
                        <span class="setting-value value-rotation" id="val-rotation">0°</span>
                    </div>
                    <input type="range" id="range-rotation" min="-3.14159" max="3.14159" step="0.01" value="0">
                </div>

                <!-- Beam Spread Slider -->
                <div class="setting-row">
                    <div class="setting-label-group">
                        <label class="setting-label clickable-label" id="label-spread">
                            <span id="spread-icon-mini" style="margin-right: 4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
                            BEAM SPREAD
                        </label>
                        <span class="setting-value value-spread" id="val-spread">69°</span>
                    </div>
                    <input type="range" id="range-spread" min="0.1" max="5.0" step="0.1" value="1.2">
                </div>

                <!-- Ray Number Slider -->
                <div class="setting-row">
                    <div class="setting-label-group">
                        <label class="setting-label clickable-label" id="label-density">
                            <span id="density-icon-mini" style="margin-right: 4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
                            RAY NUMBER
                        </label>
                        <span class="setting-value value-density" id="val-density">30</span>
                    </div>
                    <input type="range" id="range-density" min="20" max="500" value="30">
                </div>

                <!-- Ray Speed Slider -->
                <div class="setting-row">
                    <div class="setting-label-group">
                        <label class="setting-label clickable-label" id="label-speed">
                            <span id="speed-icon-mini" style="margin-right: 4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
                            RAY SPEED
                        </label>
                        <span class="setting-value value-speed" id="val-speed">40</span>
                    </div>
                    <input type="range" id="range-speed" min="0" max="100" value="40">
                </div>

                <!-- Reflections Slider -->
                <div class="setting-row">
                    <div class="setting-label-group">
                        <label class="setting-label clickable-label" id="label-reflections">
                            <span id="reflections-icon-mini" style="margin-right: 4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
                            REFLECTIONS
                        </label>
                        <span class="setting-value value-reflections" id="val-reflections">10</span>
                    </div>
                    <input type="range" id="range-reflections" min="1" max="20" value="10">
                </div>

                <!-- 1. TYPE Selection -->
                <div class="setting-row-inline" style="margin-top: 12px;">
                    <label class="setting-label">TYPE</label>
                    <div class="mode-tabs-mini" id="group-base" style="width: 180px;">
                        <button class="mini-tab active" data-value="line">Line</button>
                        <button class="mini-tab" data-value="particle">Part.</button>
                        <button class="mini-tab" data-value="ghost">Ghost</button>
                    </div>
                </div>

                <!-- 2. FLOW Selection -->
                <div class="setting-row-inline" style="margin-top: 8px;">
                    <label class="setting-label">FLOW</label>
                    <div class="mode-tabs-mini" id="group-flow" style="width: 180px;">
                        <button class="mini-tab active" data-value="none">None</button>
                        <button class="mini-tab" data-value="interval">Dash</button>
                        <button class="mini-tab" data-value="pulse">Pulse</button>
                    </div>
                </div>

                <!-- 3. EFFECTS Selection -->
                <div class="setting-row-inline" style="margin-top: 16px; justify-content: flex-start; gap: 12px;">
                    <label class="setting-label">EFFECTS</label>
                    <div class="checkbox-group">
                        <label class="chip-checkbox">
                            <input type="checkbox" id="check-trail">
                            <span>Trail</span>
                        </label>
                        <label class="chip-checkbox">
                            <input type="checkbox" id="check-taper">
                            <span>Taper</span>
                        </label>
                        <label class="chip-checkbox">
                            <input type="checkbox" id="check-bloom">
                            <span>Bloom</span>
                        </label>
                    </div>
                </div>

                <!-- 4. BOTTOM AXES -->
                <div class="setting-row" style="margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px;">
                    <label class="toggle-option">
                        <input type="checkbox" id="check-axes">
                        <span class="toggle-track"></span>
                        <span class="setting-label">SHOW GRID AXES</span>
                    </label>
                </div>

                <!-- Color Modes -->
                <div class="mode-tabs">
                    <button class="mode-tab" data-mode="cyan">Cyan</button>
                    <button class="mode-tab active" data-mode="rainbow">Rainbow</button>
                    <button class="mode-tab" data-mode="sunset">Sunset</button>
                </div>

                <!-- Action Group -->
                <div class="action-group">
                    <button class="play-btn" id="btn-reset">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Reset
                    </button>
                    <button class="play-btn active" id="btn-light">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
                        <span id="light-text">Emit</span>
                    </button>
                    <button class="play-btn active" id="btn-play">
                        <span id="play-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg></span>
                        <span id="play-text">Hold</span>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
