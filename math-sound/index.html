<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sound of Equations</title>
    
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>The Sound of Equations</h1>
            <p class="subtitle">#maths #sound #visualization</p>
        </header>

        <div class="layout">
            <div class="main-panel" id="mainPanel">
                <!-- Main Canvas Area -->
                <div class="canvas-wrapper">
                    <span class="function-title" id="functionTitle">Sine</span>
                    <span class="function-subtitle" id="functionSubtitle"></span>
                    <span class="canvas-clock" id="canvasClock">00:00:00</span>
                    <div class="equation-intro-overlay" id="equationIntroOverlay" aria-hidden="true">
                        <div class="equation-intro-card">
                            <div class="equation-intro-label">Equation Prelude</div>
                            <div class="equation-intro-formula" id="equationIntroFormula"></div>
                            <p class="equation-intro-copy" id="equationIntroCopy">How might this equation look as a graph, and what would it sound like?</p>
                        </div>
                    </div>
                    <canvas id="graphCanvas"></canvas>
                    <!-- Axis Labels -->
                    <span class="axis-label y-label">y</span>
                    <span class="axis-label x-label">x</span>
                </div>

                <!-- Formula Display -->
                <div class="formula-display">
                    <span id="formulaText"></span>
                </div>

                <!-- Waveform Visualization -->
                <div class="waveform-wrapper">
                    <canvas id="waveformCanvas"></canvas>
                </div>

                <!-- Controls -->
                <div class="controls" id="controlsBox">
                    <button id="closeControlsBtn" class="close-controls-btn" title="컨트롤 숨기기">×</button>
                    <button id="prevBtn" class="control-btn prev-btn" title="이전 (←)">
                        <span class="icon">⟨</span>
                    </button>
                    <button id="playBtn" class="control-btn play-btn" title="재생/일시정지 (Space)">
                        <span class="icon">▶</span>
                    </button>
                    <button id="stopBtn" class="control-btn stop-btn" title="정지">
                        <span class="icon">■</span>
                    </button>
                    <button id="resetBtn" class="control-btn reset-btn" title="리셋">
                        <span class="icon">↺</span>
                    </button>
                    <button id="nextBtn" class="control-btn next-btn" title="다음 (→)">
                        <span class="icon">⟩</span>
                    </button>
                    <button id="autoBtn" class="control-btn auto-btn" title="랜덤 재생 (S + 1)">
                        <span class="icon">🎲</span>
                    </button>
                    <button id="layerBtn" class="control-btn layer-btn" title="시뮬레이션 재생 (S + 2) / 창 토글 (S + 3)">
                        <span class="icon">🎹</span>
                    </button>
                    <button id="ghostBtn" class="control-btn ghost-btn active" title="가이드 그래프 토글 (S + 4)">
                        <span class="icon">👻</span>
                    </button>
                    <button id="fullscreenBtn" class="control-btn fullscreen-btn" title="전체화면 토글 (Esc)">
                        <span class="icon">⛶</span>
                    </button>
                </div>

                <!-- Simulation Sequence (Performance Mixer repurposed) -->
                <div id="mixerPanel" class="mixer-panel hidden">
                    <div class="mixer-header">
                        <h3>Simulation Queue</h3>
                        <div class="header-right">
                            <button id="clearAllBtn" class="clear-all-btn">Clear Queue</button>
                            <button id="closeMixerBtn" class="close-mixer-btn" title="닫기">✕</button>
                        </div>
                    </div>
                    <div id="activeLayers" class="active-layers queue-mode">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

            </div>

            <aside class="menu-panel" id="menuPanel">
                <button id="closeMenuBtn" class="close-menu-btn" title="메뉴 숨기기">×</button>
                <!-- Category Tabs (Split into two rows) -->
                <div class="category-tabs-wrapper">
                    <div class="category-tabs" id="categoryTabsExisting"></div>
                    <div class="category-tabs symphony-row" id="categoryTabsSymphony"></div>
                    <div class="category-tabs" id="categoryTabsCosmic"></div>
                </div>

                <!-- Browser Bar -->
                <div class="browser-bar">
                    <input id="functionSearch" class="search-input" type="text" placeholder="Search name, formula, tag...">
                    <button id="favoritesToggle" class="toggle-btn" title="즐겨찾기만 보기">★</button>
                </div>

                <!-- Function Selector (changes based on category) -->
                <div class="function-selector" id="functionSelector">
                    <!-- Populated by JavaScript -->
                </div>

                <!-- Function Counter -->
                <div class="function-counter">
                    <span id="currentIndex">1</span> / <span id="totalCount">26</span> functions
                </div>

                <!-- Sliders (Collapsible) -->
                <div class="sliders-panel collapsed" id="slidersPanel">
                    <button id="slidersToggle" class="panel-toggle" title="Toggle controls">
                        <span>Sliders</span>
                        <span class="chev">▾</span>
                    </button>
                    <div class="sliders-container">
                        <!-- Zoom Control -->
                        <div class="slider-control zoom-control">
                            <span class="slider-icon">🔍</span>
                            <input type="range" id="zoomSlider" min="50" max="200" value="100">
                            <span id="zoomValue" class="slider-value">100%</span>
                        </div>

                        <!-- Volume Control -->
                        <div class="slider-control">
                            <span class="slider-icon">🔊</span>
                            <input type="range" id="volumeSlider" min="0" max="100" value="50">
                            <span id="volumeValue" class="slider-value">50%</span>
                        </div>

                        <!-- Speed Control -->
                        <div class="slider-control">
                            <span class="slider-icon">⏱</span>
                            <input type="range" id="speedSlider" min="1" max="10" value="4">
                            <span id="speedValue" class="slider-value">0.8x</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
