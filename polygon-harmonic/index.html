<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Harmonic (V2) - Studio Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Main Visual Area (Top) -->
        <main id="main-content">
            <!-- Left: Circle and Polygon -->
            <div id="visualContainer">
                <div id="topTitle" class="overlay-text top"></div>
                <canvas id="mainCanvas"></canvas>
                <div id="bottomDesc" class="overlay-text bottom"></div>
            </div>

            <!-- Right: Standard Piano -->
            <div id="pianoContainer">
                <div id="piano">
                    <!-- Keys generated by JS -->
                </div>
            </div>
        </main>

        <!-- Controls Area (Bottom Modern Bar) -->
        <footer id="controls" class="glass-bar">
            <div class="control-group">
                <select id="polygonSelect" class="btn modern-select" title="Select Polygon">
                    <option value="0">Triangle (3 sides)</option>
                    <option value="1">Square (4 sides)</option>
                    <option value="2">Pentagon (5 sides)</option>
                    <option value="3">Hexagon (6 sides)</option>
                    <option value="4">Heptagon (7 sides)</option>
                    <option value="5">Octagon (8 sides)</option>
                    <option value="6">Nonagon (9 sides)</option>
                    <option value="7">Decagon (10 sides)</option>
                    <option value="8">Hendecagon (11 sides)</option>
                    <option value="9">Dodecagon (12 sides)</option>
                </select>
            </div>
            
            <div class="control-group center">
                <button id="playBtn" class="btn primary giant-play" title="Play/Pause">
                    <i data-lucide="play"></i> PLAY
                </button>
            </div>
            
            <div class="control-group right">
                <button id="dirBtn" class="btn-icon" title="Reverse">
                    <i data-lucide="refresh-cw"></i>
                </button>
                <input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="2.0">
                <span id="speedValue">2.0x</span>
                
                <i data-lucide="music" style="color:#aaa; width:16px; margin-left: 10px;"></i>
                <input type="range" id="pianoVol" min="0" max="1" step="0.05" value="0.4" title="Piano Volume">
                
                <i data-lucide="mic" style="color:#aaa; width:16px;"></i>
                <input type="range" id="voiceVol" min="0" max="1" step="0.05" value="1.0" title="Voice Volume">
            </div>
        </footer>
    </div>

    <!-- Hidden audio element for TTS -->
    <audio id="ttsAudio" class="hidden"></audio>

    <!-- Modals / Overlays -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
