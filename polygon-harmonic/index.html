<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Harmonic (V2) - Studio Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Main Visual Area (Top) -->
        <main id="main-content">
            <!-- Left: Circle and Polygon -->
            <div id="visualContainer">
                <div id="topTitle" class="overlay-text top"></div>
                <div id="globalTimer" class="global-timer">00:15 / 09:36</div>
                <div id="annotationsLayer"></div>
                <canvas id="mainCanvas"></canvas>
            </div>

            <!-- Right: Standard Piano + Subtitles -->
            <div id="pianoWrapper">
                <div id="pianoContainer">
                    <div id="piano">
                        <!-- Keys generated by JS -->
                    </div>
                </div>
                <div id="bottomDesc" class="piano-desc"></div>
            </div>
        </main>

        <!-- Controls Area (Bottom Modern Bar) -->
        <footer id="controls" class="glass-bar">
            <!-- Left Group: Select & Modes -->
            <div class="control-group">
                <select id="polygonSelect" class="btn modern-select" title="Select Polygon">
                    <option value="-1">Intro (0:00~0:15)</option>
                    <option value="0">Triangle (3 sides)</option>
                    <option value="1">Square (4 sides)</option>
                    <option value="2">Pentagon (5 sides)</option>
                    <option value="3">Hexagon (6 sides)</option>
                    <option value="4">Heptagon (7 sides)</option>
                    <option value="5">Octagon (8 sides)</option>
                    <option value="6">Nonagon (9 sides)</option>
                    <option value="7">Decagon (10 sides)</option>
                    <option value="8">Hendecagon (11 sides)</option>
                    <option value="9">Dodecagon (12 sides)</option>
                </select>
                
                <button id="loopBtn" class="btn secondary" title="Toggle Auto-Play">
                    <i data-lucide="repeat"></i> <span>AUTO: OFF</span>
                </button>
                <button id="verifBtn" class="btn secondary" title="Toggle Verification Mode (Youtube MP3 Sync)">
                    <i data-lucide="youtube"></i> <span>VERIF: OFF</span>
                </button>
                <button id="subtitleBtn" class="btn secondary" title="Toggle Subtitles and Annotations">
                    <i data-lucide="message-square"></i> <span>TEXT: ON</span>
                </button>
                <button id="resetBtn" class="btn-icon" title="Reset Scene">
                    <i data-lucide="rotate-ccw"></i>
                </button>
            </div>
            
            <!-- Center Group: Play -->
            <div class="control-group play-group">
                <button id="playBtn" class="btn primary giant-play" title="Play/Pause">
                    <i data-lucide="play"></i> PLAY
                </button>
            </div>
            
            <!-- Right Group: Sliders -->
            <div class="control-group sliders-group">
                <div class="slider-wrapper">
                    <i data-lucide="activity" title="Speed"></i>
                    <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1.0">
                    <span id="speedValue">1.0x</span>
                </div>
                <div class="slider-wrapper">
                    <i data-lucide="music" title="Piano Volume"></i>
                    <input type="range" id="pianoVol" min="0" max="1" step="0.05" value="0.4" title="Piano Volume">
                </div>
                <div class="slider-wrapper">
                    <i data-lucide="mic" title="Voice Volume"></i>
                    <input type="range" id="voiceVol" min="0" max="1" step="0.05" value="1.0" title="Voice Volume">
                </div>
            </div>
        </footer>
    </div>

    <!-- Hidden audio element for TTS -->
    <audio id="ttsAudio" class="hidden"></audio>
    <audio id="youtubeAudio" class="hidden" src="public/audio/youtube_original.mp3"></audio>

    <!-- Modals / Overlays -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
