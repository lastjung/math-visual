<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sort Color</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">Standalone Lab</p>
        <h1>Sort Color</h1>
        <p class="subtitle">
          Cardioid circle as a standalone base for color-driven sorting experiments.
        </p>
      </header>

      <main class="layout">
        <section class="stage-panel">
          <div class="canvas-frame">
            <canvas id="mathCanvas"></canvas>
          </div>
        </section>

        <aside class="control-panel">
          <div class="panel-header">
            <p class="eyebrow">Controls</p>
            <h2>Cardioid</h2>
          </div>
          <div id="control-list" class="control-list"></div>
        </aside>
      </main>
    </div>

    <!-- Apple Premium HUD: Play Box -->
    <div id="apple-hud" class="apple-player">
      <div class="player-controls-row">
        <!-- Left Section: Audio Controls -->
        <div class="hud-section section-left">
          <div class="hud-item-group volume-ctrl">
            <svg id="apple-vol-icon" class="hud-icon-small" style="cursor: pointer;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input type="range" id="apple-vol-slider" class="apple-slider-vol" min="0" max="1" step="0.01" value="0.15" />
          </div>
          <button id="apple-next-track" class="btn-hud-mini" title="Next Track">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
        </div>

        <!-- Center Section: Playback Controls -->
        <div class="hud-section section-center">
          <button id="apple-partial-reset" class="btn-hud-mini" title="Partial Reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14L4 9L9 4"></path>
              <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
            </svg>
          </button>
          <button id="apple-speed-down" class="btn-hud-speed" title="Slow Down">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"></path>
            </svg>
          </button>
          <button id="apple-play" class="btn-hud-main" title="Start Sorting">
            <div id="play-icon-svg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5h10"></path>
                <path d="M11 9h7"></path>
                <path d="M11 13h4"></path>
                <path d="M3 17l3 3 3-3"></path>
                <path d="M6 18V4"></path>
              </svg>
            </div>
          </button>
          <button id="apple-speed-up" class="btn-hud-speed" title="Speed Up">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 17l5-5-5-5M6 17l5-5-5-5"></path>
            </svg>
          </button>
          <button id="apple-full-reset" class="btn-hud-mini" title="Full Reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
          </button>
        </div>

        <!-- Right Section: Info & UI Controls -->
        <div class="hud-section section-right">
          <button id="btn-toggle-view" class="btn-hud-mini" title="Full View">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
          <button id="btn-hide-hud" class="btn-hud-mini btn-danger" title="Close HUD">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>


    <script src="audio.js"></script>
    <script src="core.js"></script>
    <script src="cases/cardioid_circle.js"></script>
  </body>
</html>
