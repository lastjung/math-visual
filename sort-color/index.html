<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sort Color</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">Standalone Lab</p>
        <h1>Sort Color</h1>
        <p class="subtitle">
          Cardioid circle as a standalone base for color-driven sorting experiments.
        </p>
      </header>

      <section class="global-toolbar">
        <div class="global-toolbar-copy">
          <p class="eyebrow">Global</p>
          <h2>Scene Controls</h2>
        </div>
        <div class="global-toolbar-fields">
          <div class="global-static-field">
            <label for="global-geometry-select">Geometry</label>
            <select id="global-geometry-select">
              <option value="cardioid">Cardioid</option>
            </select>
          </div>
          <div id="global-control-list" class="global-control-list"></div>
        </div>
      </section>

      <main class="layout">
        <aside id="sorting-panel" class="control-panel panel-sorting">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Sorting</p>
              <h2>Transport</h2>
            </div>
            <button id="sorting-panel-close" class="panel-close" title="Close Sorting Panel">×</button>
          </div>
          <div id="sorting-control-list" class="control-list"></div>
          
          <!-- Bottom Scenario Combo -->
          <div class="panel-footer">
            <span class="scenario-label">Study Journey</span>
            <select id="apple-scenario-select" class="apple-select-wide">
              <option value="0_default">0_default</option>
              <option value="1_rays">1_rays</option>
              <option value="2_by-sorting">2_by-sorting</option>
            </select>
            <div class="panel-footer-sfx">
              <span class="scenario-label">Game Sound</span>
              <button id="game-sfx-toggle" class="panel-footer-toggle" type="button">On</button>
            </div>
          </div>
        </aside>

        <section class="stage-panel">
          <div class="canvas-frame">
            <canvas id="mathCanvas"></canvas>
            <div id="sim-overlay" class="sim-overlay">
              <div id="sim-title" class="sim-title"></div>
              <div id="sim-subtitle" class="sim-subtitle"></div>
              <div id="sim-extra" class="sim-extra"></div>
            </div>
          </div>
        </section>

        <aside id="generator-panel" class="control-panel panel-generator">
          <div class="panel-header">
            <div>
              <p id="geometry-panel-eyebrow" class="eyebrow">Geometry</p>
              <h2 id="geometry-panel-title">Cardioid Inspector</h2>
            </div>
            <button id="generator-panel-close" class="panel-close" title="Close Generator Panel">×</button>
          </div>
          <div id="generator-control-list" class="control-list"></div>
        </aside>
      </main>
    </div>

    <button id="sorting-panel-restore" class="panel-restore panel-restore-left hidden" title="Show Sorting Panel">Sorting</button>
    <button id="generator-panel-restore" class="panel-restore panel-restore-right hidden" title="Show Generator Panel">Generator</button>

    <!-- Apple Premium Sort Bar: Play Box -->
    <div id="sort-bar" class="apple-player">
      <div class="player-controls-row">
        <!-- Left Section: Audio Controls -->
        <div class="hud-section section-left">
          <div class="hud-item-group volume-ctrl">
            <svg id="apple-vol-icon" class="hud-icon-small" style="cursor: pointer;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input type="range" id="apple-vol-slider" class="apple-slider-vol" min="0" max="1" step="0.01" value="0.15" />
          </div>
          
          <div class="hud-separator"></div>

          <button id="apple-next-track" class="btn-bar-mini" title="Next Track">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
        </div>

        <!-- Center Section: Playback Controls -->
        <div class="hud-section section-center">
          <button id="apple-partial-reset" class="btn-bar-mini" title="Reset Sort">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14L4 9L9 4"></path>
              <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
            </svg>
          </button>
          <button id="apple-speed-down" class="btn-bar-speed" title="Step Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"></path>
            </svg>
          </button>
          <button id="apple-play" class="btn-bar-main" title="Start Sorting">
            <div id="play-icon-svg">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </div>
          </button>
          <button id="apple-speed-up" class="btn-bar-speed" title="Step Forward">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 17l5-5-5-5M6 17l5-5-5-5"></path>
            </svg>
          </button>
          <button id="apple-full-reset" class="btn-bar-mini" title="Reset Case">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
          </button>
        </div>

        <!-- Right Section: Info & UI Controls -->
        <div class="hud-section section-right">
          <button id="btn-toggle-view" class="btn-bar-mini" title="Full View">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
          <button id="btn-hide-hud" class="btn-bar-mini btn-danger" title="Close Bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="audio.js"></script>
    <script src="core.js"></script>
    <script src="geometry/goldberg_sphere_provider.js"></script>
    <script src="geometry/cardioid_provider.js"></script>
    <script src="engine/color_keys.js"></script>
    <script src="engine/sort_engine.js"></script>
    <script src="engine/sort_renderer.js"></script>
    <script src="cases/cardioid_case.js"></script>
    <script src="cases/goldberg_sphere_case.js"></script>
  </body>
</html>
